[project]
name = "sms-gateway"
version = "0.1.0"
description = "ModemManager SMS gateway with emergency forwarding and a local approval-based send API"
requires-python = ">=3.12"
dependencies = ["dbus-fast>=2.0"]

[project.scripts]
sms-gateway = "sms_gateway.service:main"
smsctl = "sms_gateway.client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sms_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
